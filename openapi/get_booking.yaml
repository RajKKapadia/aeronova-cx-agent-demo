openapi: 3.0.3
info:
  title: Get airline booking
  version: 1.0.0
  description: Fictional AeroNova airline demo; no real passenger or financial data.
servers:
- url: https://grateful-lemming-clearly.ngrok-free.app
  description: Replace URL with public HTTPS tunnel/deployment reachable by Google
paths:
  /api/bookings/{bookingRef}:
    get:
      tags:
      - AeroNova Demo
      summary: Get current reservation and original flight status
      description: Use first to retrieve the passenger and original/current flight details for a booking reference.
        Does not modify data.
      operationId: get_booking
      parameters:
      - name: bookingRef
        in: path
        required: true
        description: Fictional airline booking reference, e.g. AV2048.
        schema:
          type: string
          example: AV2048
      responses:
        '200':
          description: Booking and flight details
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingRef:
                    type: string
                  passenger:
                    type: string
                  origin:
                    type: string
                  destination:
                    type: string
                  originalFlightId:
                    type: string
                  currentFlightId:
                    type: string
                  rebooked:
                    type: boolean
                  originalFlight:
                    type: object
                    properties:
                      flightId:
                        type: string
                        example: AV418
                      origin:
                        type: string
                        example: BOM
                      destination:
                        type: string
                        example: DEL
                      date:
                        type: string
                        format: date
                        example: '2026-12-15'
                      scheduledDeparture:
                        type: string
                        example: '11:15'
                        description: Local airport time HH:mm
                      estimatedDeparture:
                        type: string
                        nullable: true
                        example: '11:15'
                      delayMinutes:
                        type: integer
                        nullable: true
                        example: 0
                      status:
                        type: string
                        enum:
                        - on_time
                        - delayed
                        - cancelled
                      availableSeats:
                        type: integer
                        example: 1
                  currentFlight:
                    type: object
                    properties:
                      flightId:
                        type: string
                        example: AV418
                      origin:
                        type: string
                        example: BOM
                      destination:
                        type: string
                        example: DEL
                      date:
                        type: string
                        format: date
                        example: '2026-12-15'
                      scheduledDeparture:
                        type: string
                        example: '11:15'
                        description: Local airport time HH:mm
                      estimatedDeparture:
                        type: string
                        nullable: true
                        example: '11:15'
                      delayMinutes:
                        type: integer
                        nullable: true
                        example: 0
                      status:
                        type: string
                        enum:
                        - on_time
                        - delayed
                        - cancelled
                      availableSeats:
                        type: integer
                        example: 1
        '400':
          description: Error, response body contains error.code and error.message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '404':
          description: Error, response body contains error.code and error.message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '409':
          description: Error, response body contains error.code and error.message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '422':
          description: Error, response body contains error.code and error.message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
