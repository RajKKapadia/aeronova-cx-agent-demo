openapi: 3.0.3
info:
  title: Find alternative flights
  version: 1.0.0
  description: Fictional AeroNova airline demo; no real passenger or financial data.
servers:
- url: https://grateful-lemming-clearly.ngrok-free.app
  description: Replace URL with public HTTPS tunnel/deployment reachable by Google
paths:
  /api/flights/alternatives:
    get:
      tags:
      - AeroNova Demo
      summary: Find available alternative flights for a booking
      description: Lists seats on the same route and date as the original disrupted flight. Show inventory
        as provisional until rebook_flight succeeds.
      operationId: get_alternative_flights
      parameters:
      - name: bookingRef
        in: query
        required: true
        description: Fictional airline booking reference to find alternatives for.
        schema:
          type: string
          example: AV2048
      responses:
        '200':
          description: Available alternative flights
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingRef:
                    type: string
                  alternatives:
                    type: array
                    items:
                      type: object
                      properties:
                        flightId:
                          type: string
                          example: AV418
                        origin:
                          type: string
                          example: BOM
                        destination:
                          type: string
                          example: DEL
                        date:
                          type: string
                          format: date
                          example: '2026-12-15'
                        scheduledDeparture:
                          type: string
                          example: '11:15'
                          description: Local airport time HH:mm
                        estimatedDeparture:
                          type: string
                          nullable: true
                          example: '11:15'
                        delayMinutes:
                          type: integer
                          nullable: true
                          example: 0
                        status:
                          type: string
                          enum:
                          - on_time
                          - delayed
                          - cancelled
                        availableSeats:
                          type: integer
                          example: 1
                  note:
                    type: string
        '400':
          description: Error, response body contains error.code and error.message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '404':
          description: Error, response body contains error.code and error.message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '409':
          description: Error, response body contains error.code and error.message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '422':
          description: Error, response body contains error.code and error.message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
