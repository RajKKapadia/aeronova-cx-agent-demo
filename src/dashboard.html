<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AeroNova — Demo Operations</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e5efff;background:#070f1f}*{box-sizing:border-box}body{margin:0 auto;max-width:1220px;padding:40px 20px}h1{font-size:30px;letter-spacing:-.04em;margin:0}p{color:#94a9ce}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}button{background:#76a7fa;color:#0b1830;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;margin-left:8px}.ghost{background:#192942;color:#d7e7fb}#status{font-size:13px;color:#9fbae2;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}.card{background:#101f36;border:1px solid #253957;border-radius:15px;padding:20px;min-height:155px}.card h3{font-size:14px;color:#9fbae2;margin:0 0 14px}.large{font-size:35px;font-weight:800}.pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#243d66}.line{margin:11px 0;padding-top:10px;border-top:1px solid #253957}code{color:#a7f3d0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.wide{grid-column:span 3}.events{font-size:14px}.events .line{display:flex;gap:14px}.empty{color:#9fbae2;font-size:14px}@media(max-width:780px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><div><p>FICTIONAL AIRLINE OPERATIONS • LIVE STATE</p><h1>✈ AeroNova / Agent Actions</h1><p>Refresh during the recording to prove backend changes are real.</p></div><div><button class="ghost" onclick="load()">Refresh</button><button onclick="reset()">Reset demo</button><div id="status" role="status"></div></div></header>
<main class="grid"><section class="card"><h3>Bookings</h3><div id="bookings"></div></section><section class="card"><h3>Issued vouchers</h3><div id="vouchers"></div></section><section class="card"><h3>Human escalations</h3><div id="cases"></div></section><section class="card wide"><h3>Audit events</h3><div id="events" class="events"></div></section></main>
<script>
const escapeHtml = x => String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/admin/state');const d=await r.json();document.getElementById('bookings').innerHTML=Object.values(d.bookings).map(b=>`<div class="line"><div class="row"><strong>${escapeHtml(b.bookingRef)}</strong><span class="pill">${b.rebooked?'REBOOKED':'ORIGINAL'}</span></div><p>${escapeHtml(b.passenger)} · ${escapeHtml(b.origin)} → ${escapeHtml(b.destination)}</p><code>${escapeHtml(b.originalFlightId)} → ${escapeHtml(b.currentFlightId)}</code></div>`).join('');document.getElementById('vouchers').innerHTML=d.vouchers.length?d.vouchers.map(v=>`<div class="line"><strong>${escapeHtml(v.voucherCode)}</strong><p>${escapeHtml(v.bookingRef)} · ₹${v.amount} ${escapeHtml(v.type)}</p></div>`).join(''):'<span class="large">0</span><p class="empty">No vouchers issued</p>';document.getElementById('cases').innerHTML=d.cases.length?d.cases.map(c=>`<div class="line"><strong>${escapeHtml(c.caseId)}</strong><p>${escapeHtml(c.bookingRef)} · ${escapeHtml(c.reason)}</p></div>`).join(''):'<span class="large">0</span><p class="empty">No open escalation cases</p>';document.getElementById('events').innerHTML=d.events.length?d.events.map(e=>`<div class="line"><span class="pill">${escapeHtml(e.type)}</span><span>${escapeHtml(e.details)}</span><span style="margin-left:auto;color:#9fbae2">${escapeHtml(new Date(e.timestamp).toLocaleTimeString())}</span></div>`).join(''):'<p class="empty">Actions taken by the agent will appear here.</p>';document.getElementById('status').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.getElementById('status').textContent='Error: '+e.message}}
async function reset(){if(!confirm('Reset fictional bookings, vouchers and escalation cases?'))return;await fetch('/admin/reset',{method:'POST'});load()}load();setInterval(load,5000);
</script></body></html>
